<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Roopa Nagaral's Portfolio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="css/openapi.css">
    </head>
    <body>
        <header>
            <h1> Weather of Dallas,Tx</h1>
        </header>
        <main>
            <section id="tempandcondition">
                <button id="temperature">Temperature</button>
                <button id="weather">Weather Condition</button>
            </section>
            <section id="hourlyTemp" class="hourlyTempHide">
                <h2>Hourly Temperature</h2>
                <ul class="hour"><li>Hours: </li></ul>
                <ul class="temp"><li>Temp: </li></ul>
            </section>
            <section id="weatherCondition" class="weatherCondHide">
                <h2>Hourly Weather Conditions</h2>
                <ul class="hours"><li>Hours: </li></ul>
                <ul class="windSpeed"><li>WS: </li></ul>
                <ul class="windDirection"><li>WD: </li></ul>
                <ul class="humidity"><li>Humid: </li></ul>
                <ul class="rain"><li>Rain: </li></ul>
                <ul class="shower"><li>Shower: </li></ul>
                <ul class="snow"><li>Snow: </li></ul>
            </section>
            <p><a href="index.html">Back</a></p>
        </main>
        <script src="js/openapi.js"></script>
    </body>
</html>
